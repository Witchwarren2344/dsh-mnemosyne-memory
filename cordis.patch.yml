# Mnemosyne Memory Plugin - DSH Bundle 配置
#
# 安装: `dsh plugin --profile <name> add dsh-mnemosyne-memory`
#
# 对标 Hindsight coding-agents DSH 集成
# 此插件提供长期记忆能力：
# - 向量语义搜索（支持 Gemini/OpenAI/DeepSeek/Ollama）
# - LLM 驱动的深度反思
# - 知识页面自动生成
# - 代码库测绘
# - 跨会话记忆回溯

- insert:
    - id: mnemosyne
      name: dsh-mnemosyne-memory
      config:
        defaultRecallLimit: 10
        displayMode: sidebar
        idleReviewMs: 30000
        lifecycleEnabled: true
        recallMode: guided
        remoteAccess: read-only
        routingGuidance: true
        tabEnabled: true
        timeoutMs: 10000
        writeEnabled: true
        writebackMode: guided
