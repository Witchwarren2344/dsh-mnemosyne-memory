<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mnemosyne 记忆可视化</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { opacity: 0.9; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .stat-value { font-size: 48px; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; margin-top: 10px; font-size: 14px; text-transform: uppercase; }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; }
        .memory-list { max-height: 500px; overflow-y: auto; }
        .memory-item { padding: 15px; border-left: 4px solid #667eea; background: #f8f9fa; margin-bottom: 12px; border-radius: 0 10px 10px 0; }
        .memory-type { font-size: 11px; font-weight: bold; color: #667eea; text-transform: uppercase; }
        .memory-content { margin-top: 8px; color: #333; }
        .memory-importance { float: right; padding: 4px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .high { background: #ffcdd2; color: #c62828; }
        .medium { background: #fff9c4; color: #f57f17; }
        .low { background: #c8e6c9; color: #2e7d32; }
        .page-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .page-title { font-size: 1.3em; font-weight: bold; color: #667eea; margin-bottom: 10px; }
        .page-content { white-space: pre-wrap; color: #333; line-height: 1.8; }
        .empty { color: #999; text-align: center; padding: 40px; }
        .export-btn { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 20px; }
        .export-btn:hover { background: #5a67d8; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 Mnemosyne 记忆可视化</h1>
        <p>DeepSeek Harness 永久记忆系统 - 数据洞察与知识管理</p>
    </div>
    
    <div class="container">
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="longTermCount">0</div>
                <div class="stat-label">长期记忆</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="workingCount">0</div>
                <div class="stat-label">工作记忆</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pageCount">0</div>
                <div class="stat-label">知识页面</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="decisionCount">0</div>
                <div class="stat-label">重要决策</div>
            </div>
        </div>
        
        <div class="chart-row">
            <div class="chart-container">
                <h2>📊 记忆类型分布</h2>
                <canvas id="typeChart"></canvas>
            </div>
            <div class="chart-container">
                <h2>🎯 重要性分布</h2>
                <canvas id="importanceChart"></canvas>
            </div>
        </div>
        
        <div class="chart-container">
            <h2>📋 记忆列表</h2>
            <div class="memory-list" id="memoryList"></div>
        </div>
        
        <div class="chart-container">
            <h2>📄 知识页面</h2>
            <div id="pagesList"></div>
        </div>
        
        <button class="export-btn" onclick="exportData()">📥 导出数据</button>
    </div>
    
    <script>
        // 从 memory.json 加载数据
        let memoryData = null;
        
        async function loadData() {
            try {
                // 尝试从本地加载
                const response = await fetch('memory.json');
                memoryData = await response.json();
                renderDashboard();
            } catch(e) {
                console.log('使用示例数据');
                memoryData = {
                    memories: [],
                    working: [],
                    pages: []
                };
                renderDashboard();
            }
        }
        
        function renderDashboard() {
            const memories = memoryData.memories || [];
            const working = memoryData.working || [];
            const pages = memoryData.pages || [];
            
            // 更新统计
            document.getElementById('longTermCount').textContent = memories.length;
            document.getElementById('workingCount').textContent = working.length;
            document.getElementById('pageCount').textContent = pages.length;
            document.getElementById('decisionCount').textContent = 
                memories.filter(m => m.event_type === 'decision' && m.importance >= 0.7).length;
            
            // 类型分布
            const typeCounts = {};
            memories.forEach(m => {
                typeCounts[m.event_type] = (typeCounts[m.event_type] || 0) + 1;
            });
            
            new Chart(document.getElementById('typeChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(typeCounts),
                    datasets: [{
                        data: Object.values(typeCounts),
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4fac00', '#00f2fe'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
            
            // 重要性分布
            const high = memories.filter(m => m.importance >= 0.8).length;
            const medium = memories.filter(m => m.importance >= 0.5 && m.importance < 0.8).length;
            const low = memories.filter(m => m.importance < 0.5).length;
            
            new Chart(document.getElementById('importanceChart'), {
                type: 'bar',
                data: {
                    labels: ['高 (≥0.8)', '中 (0.5-0.8)', '低 (<0.5)'],
                    datasets: [{
                        label: '记忆数量',
                        data: [high, medium, low],
                        backgroundColor: ['#c62828', '#ef6c00', '#2e7d32'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
            
            // 渲染记忆列表
            const memoryListEl = document.getElementById('memoryList');
            memories.slice(0, 30).forEach(m => {
                const impClass = m.importance >= 0.8 ? 'high' : m.importance >= 0.5 ? 'medium' : 'low';
                const tagsHtml = m.tags ? m.tags.map(t => `<span style="background:#e3f2fd;color:#1976d2;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:5px;">${t}</span>`).join('') : '';
                memoryListEl.innerHTML += `
                    <div class="memory-item">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                            <span class="memory-type">${m.event_type}</span>
                            <span class="memory-importance ${impClass}">${m.importance.toFixed(2)}</span>
                        </div>
                        <div class="memory-content">${m.content || ''}</div>
                        <div style="margin-top:8px;">${tagsHtml}</div>
                    </div>
                `;
            });
            if (memories.length === 0) {
                memoryListEl.innerHTML = '<div class="empty">暂无记忆数据</div>';
            }
            
            // 渲染知识页面
            const pagesListEl = document.getElementById('pagesList');
            pages.forEach(p => {
                pagesListEl.innerHTML += `
                    <div class="page-card">
                        <div class="page-title">${p.title || p.id}</div>
                        <div class="page-content">${p.content || ''}</div>
                    </div>
                `;
            });
            if (pages.length === 0) {
                pagesListEl.innerHTML = '<div class="empty">暂无知识页面</div>';
            }
        }
        
        function exportData() {
            const dataStr = JSON.stringify(memoryData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mnemosyne_memory.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // 初始化
        loadData();
    </script>
</body>
</html>
